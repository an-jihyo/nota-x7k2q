<style>
/* NOTA exhibition mock-up app. Layout: one 890x1939 native canvas scaled to the phone width. */
:root{--nf:.44;--sky:#1EB9FB;--teal:#3be0dc;--ink:#5a3a12;--yellow:#FFCD00;--orange:#FFA600;--blue:#1E7FC0;--night:#0b1620}

@font-face{font-family:F;src:url(fonts/NS-R.woff) format('woff');font-weight:500}
@font-face{font-family:F;src:url(fonts/NS-B.woff) format('woff');font-weight:600}
@font-face{font-family:F;src:url(fonts/NS-B.woff) format('woff');font-weight:700}
@font-face{font-family:F;src:url(fonts/NS-EB.woff) format('woff');font-weight:800}

*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--night);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:F,system-ui,sans-serif}

.a{position:absolute}
.scr .lay,#scr .lay{position:absolute;left:0;top:0;width:100%;height:100%}
.scr .lay img,#scr .lay img{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.hs{position:absolute;background:transparent;border:0;padding:0;margin:0;z-index:20;outline:none;cursor:pointer}
.hs[disabled]{display:none}
.rip{position:absolute;z-index:99;width:calc(var(--nf)*120px);height:calc(var(--nf)*120px);margin:calc(var(--nf)*-60px) 0 0 calc(var(--nf)*-60px);border-radius:50%;border:calc(var(--nf)*9px) solid #fff;pointer-events:none;animation:rip .5s ease-out forwards}

@keyframes pulse{from{transform:scale(.55);opacity:.95}to{transform:scale(1.35);opacity:0}}
.hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:30;background:#fff;color:var(--blue);font-weight:800;font-size:calc(var(--nf)*44px);padding:calc(var(--nf)*20px) calc(var(--nf)*44px);border-radius:999px;box-shadow:0 calc(var(--nf)*10px) 0 rgba(0,50,100,.2);white-space:nowrap;pointer-events:none;transition:opacity .25s,transform .25s}
.hint.off{opacity:0;transform:translateX(-50%) translateY(20px)}
.endc{position:absolute;left:9%;right:9%;top:31%;z-index:40;background:#fff;color:var(--ink);border-radius:calc(var(--nf)*80px);padding:calc(var(--nf)*70px) calc(var(--nf)*50px) calc(var(--nf)*56px);text-align:center;box-shadow:0 calc(var(--nf)*16px) 0 rgba(0,50,100,.22);animation:endin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes endin{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.endc b{display:block;font-weight:900;font-size:calc(var(--nf)*88px);line-height:1.25}
.endc span{display:block;font-weight:700;font-size:calc(var(--nf)*44px);color:#8a6a3a;margin-top:calc(var(--nf)*14px)}
.endc .bt{display:block;width:100%;margin-top:calc(var(--nf)*30px);border:0;border-radius:999px;font-family:F;font-weight:900;font-size:calc(var(--nf)*50px);padding:calc(var(--nf)*30px) 0;background:var(--orange);color:#fff;box-shadow:0 calc(var(--nf)*10px) 0 #D98800;cursor:pointer}
.endc .bt.s{background:#FFF1C2;color:var(--ink);box-shadow:0 calc(var(--nf)*10px) 0 #E8D08A}
.tag{position:absolute;z-index:30;background:#FFE45C;color:#3a2410;font-weight:900;font-size:calc(var(--nf)*34px);padding:calc(var(--nf)*8px) calc(var(--nf)*22px);border-radius:calc(var(--nf)*14px);pointer-events:none}
#pz{position:absolute;left:0;top:0;width:55%;height:4.8%;z-index:95}
#pm{position:absolute;inset:0;z-index:100;background:rgba(8,20,34,.72);display:flex;align-items:center;justify-content:center}

#pm .box{width:84%;background:#fff;color:var(--ink);border-radius:calc(var(--nf)*60px);padding:calc(var(--nf)*54px) calc(var(--nf)*46px);display:flex;flex-direction:column;gap:calc(var(--nf)*22px)}
#pm h2{margin:0 0 calc(var(--nf)*6px);font-size:calc(var(--nf)*58px);font-weight:900}
#pm p{margin:0;font-size:calc(var(--nf)*34px);font-weight:700;color:#8a6a3a;line-height:1.4}
#pm button{font-family:F;font-weight:800;font-size:calc(var(--nf)*44px);padding:calc(var(--nf)*26px) 0;border:0;border-radius:calc(var(--nf)*40px);background:#FFF1C2;color:var(--ink);cursor:pointer}
#pm button.p{background:var(--orange);color:#fff}
#loader{position:fixed;inset:0;z-index:200;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#fff;transition:opacity .4s}
#loader img{width:min(46vw,220px)}
#loader .bar{width:min(52vw,240px);height:12px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}

@media (prefers-reduced-motion:reduce){.pulse,.rip{animation-duration:.01s}}
input,textarea{-webkit-user-select:text;user-select:text;touch-action:manipulation}

<div id="stage"><div id="scr" class="scr"></div></div>

<script>
const st=document.getElementById('scr');
const S='scr/', CH='chars/', L='L/', PD='A11/P3/', R11=new Set(['n_com1','n_com2','n_rec1','n_rec3','n_rec4']), NW=890, NH=1939, NF=358/890;
let PJ={},GJ={},OV={};
const LAYERED=new Set(['balloon1','balloon2','balloon3','tidy1','tidy2','tidy3','dive1','dive2','dive3','home2','home3','al2','al3','al6']);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=(x,s=1.8)=>{if(x<=0)return 0;if(x>=1)return 1;const c3=s+1;return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const ebIn=(x,s=1.5)=>{const c3=s+1;return c3*x*x*x-s*x*x};
const lerp=(a,b,x)=>a+(b-a)*x;
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||st).appendChild(e);return e}
const U=p=>p.replace(/\.(png|jpg)$/i,'.webp');
function img(src,cls,parent){const e=el('img',cls,null,parent);e.src=U(src);e.draggable=false;return e}
function T(e,x,y,s=1,r=0,o=1,sx=null,sy=null){const w=e.offsetWidth,h=e.offsetHeight;
  e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';e.style.transform=`rotate(${r}deg) scale(${sx??s},${sy??s})`;e.style.opacity=o;}
// left-anchored pop text
function TL(e,x,y,s=1,o=1){e.style.left=x+'px';e.style.top=(y-e.offsetHeight/2)+'px';e.style.transformOrigin='0 50%';e.style.transform=`scale(${s})`;e.style.opacity=o}
// pop in/out envelope: returns [scale,opacity]
function pop(t,a,b=1e9,dur=.38){const i=eb(P(t,a,a+dur),2.2), o=P(t,b,b+.22);return [lerp(.4,1,i)*(1-0.25*o), P(t,a,a+.1)*(1-o)]}
const CHS={c1:[1095,1350],c2:[964,1158],c3:[645,1241],c4:[1072,1514],c5:[612,1227],c6:[1137,1450]};
const ORDER=['c1','c2','c5','c3','c4','c6'];
function chr(n,h,parent){const e=img(CH+n+'.png','a',parent);const [w0,h0]=CHS[n];e.style.height=h+'px';e.style.width=(w0*h/h0)+'px';e.style.transformOrigin='50% 100%';return e}
function placeB(e,x,yb,sx=1,sy=1,r=0,o=1){const w=parseFloat(e.style.width),h=parseFloat(e.style.height);
  e.style.left=(x-w/2)+'px';e.style.top=(yb-h)+'px';e.style.transform=`rotate(${r}deg) scale(${sx},${sy})`;e.style.opacity=o}
function lineup(h,gap){const ws=ORDER.map(n=>CHS[n][0]*h/CHS[n][1]);const gaps=[gap,gap,-2,gap,gap];
  const tot=ws.reduce((a,b)=>a+b,0)+gaps.reduce((a,b)=>a+b,0);let x=(1920-tot)/2;const cs=[];ws.forEach((w,i)=>{cs.push(x+w/2);x+=w+(gaps[i]||0)});return cs}
function hopIn(cs,xs,t,t0,base,amp=1){cs.forEach((c,i)=>{const k=P(t,t0+i*.09,t0+.55+i*.09);const land=P(t,t0+.55+i*.09,t0+.8+i*.09);
  const sq=land>0&&land<1?1-0.12*Math.sin(land*Math.PI):1;const hop=t>t0+1.2?Math.max(0,Math.sin((t-t0-1.2)*4.2-i*.7))*26*amp:0;
  placeB(c,xs[i],base+700*(1-eb(k,1.7))-hop,1+(1-sq)*.6,sq,0,1)})}
function chip(n,t){return el('div','chip',`<span class="n">${n}</span><span class="t">${t}</span>`)}
function chipF(c,t){const k=eb(P(t,.1,.45),2.2);c.style.transform=`scale(${lerp(.5,1,k)})`;c.style.opacity=P(t,.1,.18)}
function screenEl(n,parent){const d=el('div','lay',null,parent);
  if(LAYERED.has(n)){d.bg=img(L+n+'_bg.jpg',null,d);d.art=img(L+n+'_art.png',null,d);d.ui=img(L+n+'_ui.png',null,d);d.layered=true}
  else{img((R11.has(n)?'A11/scr/':S)+n+'.png',null,d)}
  d.style.opacity=0;return d}
function play(d,lt,amp=1){if(!d.layered)return;const k=eb(P(lt,.05,.5),1.8);
  d.art.style.transformOrigin='50% 60%';d.art.style.transform=`translateY(${(1-k)*46+Math.sin(lt*3.2)*5*amp}px) scale(${0.86+0.14*k}) rotate(${Math.sin(lt*2.1)*0.8*amp}deg)`;
  d.art.style.opacity=P(lt,0,.12);const u=eb(P(lt,.2,.5),2);d.ui.style.opacity=P(lt,.2,.3);d.ui.style.transform=`translateY(${(1-u)*16}px)`}
function phone(screens){const p=el('div','phone a');const s=el('div','scr',null,p);const ims=screens.map(n=>screenEl(n,s));if(ims[0])ims[0].style.opacity=1;return {p,s,ims}}
const PW=382,PH=804,SW=358,SH=780,PCY=590;
function nat(parent){const d=el('div',null,null,parent);Object.assign(d.style,{position:'absolute',left:0,top:0,width:NW+'px',height:NH+'px',transformOrigin:'0 0',transform:'scale(var(--nf),var(--nfy))',overflow:'hidden'});return d}
function spr(src,parent,x,y,w,h,origin='50% 50%'){const e=img(src,null,parent);Object.assign(e.style,{position:'absolute',left:x+'px',top:y+'px',width:w+'px',height:h+'px',transformOrigin:origin});return e}
function g(name,parent,origin){const j=GJ[name];return spr('G/'+name+'.png',parent,j.x,j.y,j.w,j.h,origin)}
function full(src,parent){return spr(src,parent,0,0,NW,NH)}
function div(parent,css){const d=el('div',null,null,parent);d.style.position='absolute';Object.assign(d.style,css);return d}
function cig(){return el('div','a',`<svg width="190" height="50" viewBox="0 0 150 40"><rect x="4" y="10" width="100" height="20" rx="4" fill="#fff"/><rect x="104" y="10" width="38" height="20" rx="4" fill="#FFA600"/><rect x="0" y="10" width="10" height="20" rx="3" fill="#9a9a9a"/><circle cx="3" cy="20" r="4" fill="#FA2488"/></svg>`)}
function finger(){return el('div','a',`<svg width="200" height="260" viewBox="0 0 200 260"><path d="M70 20 q0-20 20-20 q20 0 20 20 v90 l60 14 q24 6 24 32 v40 q0 60-60 64 h-40 q-40 0-60-40 l-30-60 q-8-18 8-24 q14-6 26 10 l12 18 z" fill="#FFE0CC"/><rect x="74" y="6" width="32" height="26" rx="12" fill="#FFF3EB"/></svg>`)}
const SVGNS='http://www.w3.org/2000/svg';
function svg(parent,w,h,html){const s=document.createElementNS(SVGNS,'svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.style.position='absolute';s.style.left=0;s.style.top=0;s.style.overflow='visible';if(html)s.innerHTML=html;parent.appendChild(s);return s}

let SC={}, cur=null;
function tapFx(parent){const d=div(parent,{width:'0',height:'0',zIndex:20});
  d.innerHTML=`<div class="dt" style="position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 3px rgba(0,0,0,.08)"></div><div class="rp" style="position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:4px solid #fff"></div>`;
  d.dt=d.querySelector('.dt');d.rp=d.querySelector('.rp');return d}
function tapAt(fx,t,t0,fx_,fy,W=SW,H=SH){fx.style.left=(fx_*W)+'px';fx.style.top=(fy*H)+'px';
  const on=t>t0-.25&&t<t0+.2;fx.dt.style.opacity=on?1:0;fx.dt.style.transform=`scale(${t<t0-.05?lerp(.4,1,eb(P(t,t0-.25,t0-.08),2)):lerp(.8,1,P(t,t0,t0+.15))})`;
  const r=P(t,t0,t0+.45);fx.rp.style.opacity=r>0&&r<1?1-r:0;fx.rp.style.transform=`scale(${1+r*2.2})`}
function makeBalloon(parent){
  const N=nat(parent);full(L+'balloon3_bg.jpg',N);
  const CX=250,CB=1330,CS=0.8,C=GJ.g1_char;const BX0=C.x+C.w/2,BY0=C.y+C.h;
  const FEETX=CX+(394-C.w/2)*CS;
  const sh=div(N,{left:(FEETX-170)+'px',top:(CB-22)+'px',width:'340px',height:'46px',borderRadius:'50%',background:rgb(GJ.g1_shadow.col)});
  const sv=svg(N,NW,NH);const COL=['red','blue','green','pink'];
  const lines=COL.map(()=>{const l=document.createElementNS(SVGNS,'line');l.setAttribute('stroke','#fff');l.setAttribute('stroke-width','7');l.setAttribute('stroke-linecap','round');sv.appendChild(l);return l});
  const ch=g('g1_char',N,'50% 100%');
  const TIP={redhand:[217,521,441,522],red:[217,521,441,522],blue:[316,572,563,620],green:[236,573,574,628],pink:[223,539,481,556]};
  const mk=n=>{const [tx,ty,w,h]=TIP[n];return spr((n=='red'||n=='redhand')?'A10/b_red.png':'N/b_'+n+'.png',N,0,0,w,h,`${tx}px ${ty}px`)};
  const inh=mk('redhand');const bs=COL.map(mk);
  const HS=0.63,HX=380,HY=1500;
  const hand=div(N,{left:HX+'px',top:HY+'px',width:829*HS+'px',height:936*HS+'px',transformOrigin:'60% 100%'});
  hand.innerHTML=`<svg width="${829*HS}" height="${1600*HS}" viewBox="0 0 829 1600" style="position:absolute;left:0;top:0;overflow:visible"><path d="M318 735 L816 752 L900 1500 L470 1500 Z" fill="#FBD5BE"/><path d="M455 1180 L880 1180 L905 1500 L470 1500 Z" fill="#FFA600"/><rect x="440" y="1160" width="470" height="60" rx="22" fill="#FFCD00"/></svg>`;
  spr('N/hand.png',hand,0,0,829*HS,936*HS);
  const PX=HX+192*HS, PY=HY+268*HS, BR=-40;
  const puff=div(N,{left:PX+'px',top:PY+'px',width:0,height:0});puff.innerHTML=[-1,0,1].map(j=>`<div class="aw" style="position:absolute;left:${-9+j*30}px;top:-30px;width:18px;height:60px;border-radius:9px;background:#fff"></div>`).join('');const aws=[...puff.querySelectorAll('.aw')];
  const ui1=full(L+'balloon1_ui.png',N), ui2=full(L+'balloon2_ui.png',N);
  const AXo=(574-BX0)*CS, AYo=(463-BY0)*CS;
  const FIN=[[-190,-140],[185,-150],[-55,-230],[95,-225]];
  const IN=[[2.4,3.9,3],[4.6,5.5,2],[6.2,7.0,2],[7.7,8.5,2]];const FLY=0.7;
  const SC_IN=[0.75,0.62,0.62,0.62],SC_F=0.6;
  const sfx=[[0.1,'pop',.6],[1.2,'popHi',.4],[2.0,'whooshS',.3]];
  IN.forEach(([s0,s1,np])=>{for(let q=0;q<np;q++){const tq=s0+q*(s1-s0)/np;sfx.push([tq-.05,'puff',.5],[tq,'inflate',.7])}sfx.push([s1,'whooshS',.35],[s1+FLY,'boing',.4])});
  sfx.push([IN[3][1]+FLY+.4,'whistle',.9]);
  return {sfx,frame(lt){
    const pop0=eb(P(lt,0,.45),1.8);
    let lift=0;const INC=[-40,-60,-70,-30];for(let i=0;i<4;i++){const tt=IN[i][1]+FLY;lift+=INC[i]*eb(P(lt,tt-.1,tt+.5),1.6)}
    const tt3=IN[3][1]+FLY;const away=ei(P(lt,tt3+.4,tt3+2.4));lift+=-2400*away;
    const air=cl(-lift/40);const bob=Math.sin(lt*2.6)*14*air*(1-away);const cy=lift+bob;
    const rot=Math.sin(lt*1.8)*3*air;
    ch.style.transform=`translate(${CX-BX0}px,${CB-BY0+(1-pop0)*60+cy}px) scale(${CS*(0.85+0.15*pop0)}) rotate(${rot}deg)`;ch.style.opacity=P(lt,0,.1);
    const k=cl(-lift/220);sh.style.transform=`scale(${(1-0.85*k)*(0.85+0.15*pop0)},${1-0.6*k})`;sh.style.opacity=(1-0.95*k)*P(lt,0,.1);
    const ax=CX+AXo, ay=CB+AYo+cy;
    ui1.style.opacity=P(lt,.2,.3)*(1-P(lt,1.2,1.3));ui2.style.opacity=P(lt,1.2,1.3)*(1-P(lt,2.1,2.25));
    const hin=eb(P(lt,2.0,2.45),1.6), hout=ebIn(P(lt,9.0,9.4));const hy=(1-hin)*700+hout*750;
    hand.style.transform=`translateY(${hy}px) rotate(${Math.sin(lt*9)*1.2*hin*(1-hout)}deg)`;
    bs.forEach((b,i)=>{const [s0,s1,np]=IN[i];
      let sc=0.22;for(let q=0;q<np;q++){const tq=s0+q*(s1-s0)/np;sc+=(1-0.22)/np*eb(P(lt,tq,tq+.32),2.4)}
      const f=eio(P(lt,s1,s1+FLY));const [tx,ty]=TIP[COL[i]];
      const kx=lerp(PX,ax+FIN[i][0],f)+(i%2?1:-1)*Math.sin(f*Math.PI)*120, ky=lerp(PY+hy,ay+FIN[i][1],eo(f));
      const sway=Math.sin(lt*2+i*1.7)*5*f;
      if(i==0){inh.style.left=(PX-243)+'px';inh.style.top=(PY+hy-535)+'px';inh.style.transform=`rotate(${BR}deg) scale(${SC_IN[0]*sc*(1+0.03*Math.sin(lt*20)*(lt<s1))})`;inh.style.opacity=(lt>=s0&&lt<s1+.08)?1:0}
      b.style.left=(kx-tx)+'px';b.style.top=(ky-ty)+'px';
      const s=i==0?SC_F:lerp(SC_IN[i]*sc,SC_F,f);
      b.style.transform=`rotate(${lerp(BR,sway,f)}deg) scale(${s})`;
      b.style.opacity=i==0?(lt>=s1+.05?1:0):(lt>=s0?1:0);
      lines[i].setAttribute('x1',ax);lines[i].setAttribute('y1',ay);lines[i].setAttribute('x2',kx);lines[i].setAttribute('y2',ky);lines[i].style.opacity=lt>s1+.08?1:0;
    });
    // hand must be above balloons: keep z by DOM order (hand added after)
    let pf=0;IN.forEach(([s0,s1,np])=>{for(let q=0;q<np;q++){const tq=s0+q*(s1-s0)/np;const x=P(lt,tq-.05,tq+.3);pf=Math.max(pf,x>0&&x<1?Math.sin(x*Math.PI):0)}});
    puff.style.opacity=pf>0?1:0;puff.style.transform=`translateY(${hy}px) rotate(${BR}deg)`;
    aws.forEach((a,j)=>{const u=((lt*3.2+j*.33)%1);a.style.transform=`translateY(${70-u*150}px) scaleY(${0.6+0.6*Math.sin(u*Math.PI)})`;a.style.opacity=pf*Math.sin(u*Math.PI)});
  }};
}

const mic={on:false,failed:false,an:null,buf:null,lvl:0,floor:.02};
async function micStart(){
  if(ST.mic===false||mic.on||mic.failed)return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ac();const src=a.createMediaStreamSource(s);const an=a.createAnalyser();an.fftSize=1024;src.connect(an);
    mic.an=an;mic.buf=new Float32Array(1024);mic.on=true;
  }catch(e){mic.failed=true}
}
function micBlow(dt){
  if(!mic.on)return false;
  mic.an.getFloatTimeDomainData(mic.buf);let s=0;for(let i=0;i<mic.buf.length;i++)s+=mic.buf[i]*mic.buf[i];
  const r=Math.sqrt(s/mic.buf.length);mic.lvl=mic.lvl*.6+r*.4;

<button data-a="al0">기상 알림 보기</button><button data-a="al1">점심 알림 보기</button><button data-a="al2">미접속 알림 보기</button><button data-a="al3">7일 리포트 알림 보기</button>
<button data-a="onb">처음 사용자 설정 화면 보기</button>
<button data-a="dvs">잠수하기 3분 바로 끝내기</button>
<button data-a="snd">소리 켜기/끄기</button><button data-a="close">닫기</button></div>`;
function openPresenter(){pm.hidden=false}
function closePresenter(){pm.hidden=true}
pm.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target===pm)closePresenter();return}
  const a=b.dataset.a;if(a=='onb'){closePresenter();show('goal1','push')}else if(a=='dvs'){closePresenter();if(game&&game.skip)game.skip();else toast('잠수하기를 시작한 뒤에 눌러 주세요')}else if(a=='reset'){resetAll()}else if(a&&a.startsWith('al'))runAlarm(+a[2]);else if(a=='snd'){soundOn=!soundOn;b.textContent='소리 '+(soundOn?'켜짐 (눌러서 끄기)':'꺼짐 (눌러서 켜기)')}else closePresenter()});
let pzT=null;pz.addEventListener('pointerdown',()=>{pzT=setTimeout(openPresenter,700)});['pointerup','pointercancel','pointerleave'].forEach(n=>pz.addEventListener(n,()=>clearTimeout(pzT)));
addEventListener('keydown',e=>{if(e.key=='p')pm.hidden=!pm.hidden});
function resetAll(){closePresenter();closeAlarm(true);destroyGame();loop=null;holding=false;busy=false;accAnim=null;accSet(0);mateReset();calRender(0);selectDay(TODAY_I,false);setGoal(0);ST.share=true;shareUI();closeModal();gamePaused=false;showNow('splash')}

// ---------- global ----------
scr.addEventListener('pointerdown',e=>{idleT=performance.now();const r=scr.getBoundingClientRect();const d=document.createElement('div');d.className='rip';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';scr.appendChild(d);setTimeout(()=>d.remove(),520);ac()},true);
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(loop&&!gamePaused)loop(dt,now/1000);ticks.forEach(f=>f(dt,now/1000));
  idleCheck(now);
  requestAnimationFrame(tick)}

// ---------- modal / game quit / game settings / idle reset ----------
const MZ=document.createElement('div');MZ.style.cssText='position:absolute;inset:0;z-index:90;background:rgba(10,30,50,.5);display:none;align-items:center;justify-content:center;font-family:'+FF;scr.appendChild(MZ);
function closeModal(){MZ.style.display='none';MZ.innerHTML=''}
function modal(build){MZ.innerHTML='';const c=document.createElement('div');
  c.style.cssText='width:84%;background:#fff;border-radius:calc(var(--nf)*64px);padding:calc(var(--nf)*54px) calc(var(--nf)*46px) calc(var(--nf)*44px);box-shadow:0 calc(var(--nf)*16px) 0 rgba(0,50,100,.25);color:#3b2b22;animation:endin .35s cubic-bezier(.2,1.2,.4,1)';
  MZ.appendChild(c);build(c);MZ.style.display='flex';holding=false}
function mBtn(parent,label,primary,fn){const b=document.createElement('button');b.textContent=label;
  b.style.cssText='display:block;width:100%;margin-top:calc(var(--nf)*26px);border:0;border-radius:999px;font-family:'+FF+';font-weight:900;font-size:calc(var(--nf)*46px);padding:calc(var(--nf)*28px) 0;cursor:pointer;'+(primary?'background:#FFA800;color:#fff;box-shadow:0 calc(var(--nf)*10px) 0 #D98800':'background:#FFF1C2;color:#3b2b22;box-shadow:0 calc(var(--nf)*10px) 0 #E8D08A');
  b.onclick=()=>{sfx('tap');fn()};parent.appendChild(b);return b}
function mTitle(c,t,sub){const h=document.createElement('div');h.textContent=t;h.style.cssText='font-weight:900;font-size:calc(var(--nf)*60px);text-align:center;line-height:1.25';c.appendChild(h);
  if(sub){const s=document.createElement('div');s.textContent=sub;s.style.cssText='font-weight:700;font-size:calc(var(--nf)*36px);text-align:center;color:#8a6a3a;margin-top:calc(var(--nf)*16px);line-height:1.4';c.appendChild(s)}}
// ---- quit a running game (asks first)
function askQuit(){if(!game||MZ.style.display=='flex')return;gamePaused=true;holding=false;
  modal(c=>{mTitle(c,'게임을 끝낼까요?','지금 나가면 이번 노타하기는 기록되지 않아요.');
    mBtn(c,'계속하기',true,()=>{closeModal();gamePaused=false});
    mBtn(c,'끝내기',false,()=>{closeModal();gamePaused=false;leaveGame('home')})})}
function addGameX(p){const b=document.createElement('button');
  b.style.cssText='position:absolute;left:85.8%;top:2.06%;width:10%;height:4.64%;z-index:36;border:0;border-radius:50%;background:#fff;box-shadow:0 calc(var(--nf)*6px) 0 rgba(0,50,100,.25);cursor:pointer;padding:0';
  b.innerHTML='<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M13 13 L27 27 M27 13 L13 27" stroke="#3a6a8a" stroke-width="4.5" stroke-linecap="round"/></svg>';
  b.onclick=e=>{e.stopPropagation();askQuit()};b.addEventListener('pointerdown',e=>e.stopPropagation());p.appendChild(b)}
// ---- game settings (gear on the 노타하기 screens)
function toggleRow(c,label,sub,get,set){const r=document.createElement('div');r.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:calc(var(--nf)*26px) 0;border-bottom:calc(var(--nf)*3px) solid #F0E8D8;cursor:pointer';
  const l=document.createElement('div');l.innerHTML='<div style="font-weight:800;font-size:calc(var(--nf)*44px)">'+label+'</div>'+(sub?'<div style="font-weight:600;font-size:calc(var(--nf)*30px);color:#9a8060;margin-top:calc(var(--nf)*4px)">'+sub+'</div>':'');
  const sw=document.createElement('div');const kn=document.createElement('i');sw.appendChild(kn);r.append(l,sw);
  const paint=()=>{const on=get();sw.style.cssText='flex:none;position:relative;width:calc(var(--nf)*124px);height:calc(var(--nf)*70px);border-radius:999px;transition:background .2s;background:'+(on?'#FFA800':'#D8D2C8');
    kn.style.cssText='position:absolute;top:calc(var(--nf)*7px);width:calc(var(--nf)*56px);height:calc(var(--nf)*56px);border-radius:50%;background:#fff;box-shadow:0 calc(var(--nf)*4px) 0 rgba(0,0,0,.18);transition:left .2s;left:'+(on?'calc(var(--nf)*61px)':'calc(var(--nf)*7px)')};
  paint();r.onclick=()=>{set(!get());paint();sfx('tap');if(label=='진동')vibe(80)};c.appendChild(r)}
function openGameSettings(){modal(c=>{mTitle(c,'노타하기 설정');const w=document.createElement('div');w.style.marginTop='calc(var(--nf)*18px)';c.appendChild(w);
  toggleRow(w,'배경 음악','게임을 하는 동안 잔잔한 음악이 나와요',()=>ST.music,v=>{ST.music=v});
  toggleRow(w,'효과음','누르거나 성공할 때 나는 소리',()=>soundOn,v=>{soundOn=v});
  toggleRow(w,'진동','알림과 게임 중 진동',()=>ST.vib,v=>{ST.vib=v});
  toggleRow(w,'마이크','풍선 불기에서 입김을 인식해요',()=>ST.mic,v=>{ST.mic=v;if(!v){mic.on=false}else{mic.failed=false}});
  mBtn(c,'닫기',true,closeModal)})}
[[pick,'picker'],[ready,'ready']].forEach(([pg])=>hot(pg,.82,.054,.97,.114,()=>{sfx('tap');openGameSettings()}));
// ---- soft background music (only on the 노타하기 screens)
let bgmT=0,bgmI=0;const SCL=[523,587,659,784,880,784,659,587];
ticks.push(dt=>{if(!ST.music||!soundOn||gamePaused||!['game','picker','ready'].includes(curName)||(game&&game.kind=='balloon')||MZ.style.display=='flex')return;
  bgmT-=dt;if(bgmT<=0){bgmT=.6;const f=SCL[bgmI++%SCL.length]*(Math.floor(bgmI/8)%2?.75:1);tone(f,f*.997,.7,'sine',.028)}});
// ---- idle: back to the splash screen (exhibition use)
const IW=document.createElement('div');IW.style.cssText='position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:95;background:#3b2b22;color:#fff;font-weight:800;font-size:calc(var(--nf)*33px);padding:calc(var(--nf)*22px) calc(var(--nf)*36px);border-radius:999px;white-space:nowrap;display:none;font-family:'+FF+';pointer-events:none;text-align:center';scr.appendChild(IW);
function idleCheck(now){const rem=IDLE_MS-(now-idleT);const act=curName!='splash'&&!holding;
  if(!act){idleT=now;IW.style.display='none';return}
  if(rem<=0){idleT=now;IW.style.display='none';resetAll();return}
  if(rem<10000){IW.style.display='block';IW.textContent='화면을 터치하지 않으면 '+Math.ceil(rem/1000)+'초 뒤 처음 화면으로 돌아가요'}else IW.style.display='none'}
hot(splash,0,0,1,1,()=>{sfx('tap');show('home')});

// ---------- boot ----------
async function boot(){
  const lb=document.getElementById('lb'),lt=document.getElementById('lt');let n=0;
  const jobs=MANIFEST.map(src=>new Promise(res=>{const i=new Image();i.onload=i.onerror=()=>{n++;lb.style.width=(n/MANIFEST.length*100)+'%';res()};i.src=src}));
  const fonts=Promise.all([500,700,800,900].map(w=>document.fonts.load(`${w} 40px F`,'가나다 NOTA')));
  await Promise.race([Promise.all([...jobs,fonts]),new Promise(r=>setTimeout(r,25000))]);
  showNow('splash');
  const ld=document.getElementById('loader');ld.style.opacity=0;setTimeout(()=>ld.remove(),450);
  last=performance.now();requestAnimationFrame(tick);setTimeout(()=>{if(curName=='splash')show('home')},1600);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
}
boot();
